name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m build
      - name: Execute the algorithm notebooks
        env:
          MPLBACKEND: Agg
        run: >-
          jupyter nbconvert --to notebook --execute
          notebooks/*.ipynb
          --output-dir "${{ runner.temp }}"
          --ExecutePreprocessor.timeout=120
