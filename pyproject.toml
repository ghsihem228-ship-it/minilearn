[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minilearn"
version = "0.1.0"
description = "Educational machine learning algorithms implemented with NumPy."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ruff>=0.9",
    "build>=1.2",
]

[tool.setuptools.packages.find]
include = ["minilearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
